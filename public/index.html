<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grapple Arena</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap"
      rel="stylesheet"
    />
    <style>
      #playerShape {
        margin-bottom: 1rem;
        padding: 0.5rem 1rem;
        font-size: 1rem;
        border-radius: 8px;
        border: none;
        width: 220px;
        text-align: center;
      }

      /* reset margins & force full-screen canvas */
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #1a1a33;
      }
      /* Homepage & Customizer */
      .fullscreen-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #2a2a49 0%, #1a1a2f 80%);
        color: #f0f0f5;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
        font-family: "Orbitron", sans-serif;
      }
      .fullscreen-overlay h1 {
        font-size: 5rem;
        margin-bottom: 1rem;
        letter-spacing: 6px;
        background: linear-gradient(90deg, #ff0080, #ff8c00, #40e0d0, #ff0080);
        background-size: 300% 300%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: rainbow 5s ease infinite;
      }
      @keyframes rainbow {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
      .btn {
        padding: 0.75rem 2rem;
        font-size: 1.25rem;
        font-weight: bold;
        color: #fff;
        background: linear-gradient(45deg, #ff0080, #ff8c00);
        border: none;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        transition: transform 0.2s, box-shadow 0.2s;
        margin: 0.5rem;
      }
      .btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
      }
      .btn:active {
        transform: translateY(0);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      }

      /* Inputs */
      #playerName,
      #playerColor,
      #hookColor,
      #particleColor {
        margin-bottom: 1rem;
        width: 200px;
        text-align: center;
        padding: 0.5rem 1rem;
        font-size: 1rem;
        border: none;
        border-radius: 8px;
      }
      /* color-picker swatches */
      #customizePanel input[type="color"] {
        -webkit-appearance: none;
        appearance: none;
        width: 60px;
        height: 60px;
        padding: 0;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
        margin-bottom: 1rem;
      }
      #customizePanel input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 0;
      }
      #customizePanel input[type="color"]::-webkit-color-swatch {
        border: none;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <!-- Home Screen -->
    <div id="home" class="fullscreen-overlay">
      <h1>🔗 Grapple Arena</h1>
      <input id="playerName" type="text" placeholder="Enter Your Name" />
      <div>
        <button id="startBtn" class="btn">Start Game</button>
        <button id="customizeBtn" class="btn">Customize</button>
      </div>
    </div>

    <!-- Customizer Panel -->
    <div id="customizePanel" class="fullscreen-overlay" style="display: none">
      <h1>Customize Your Gear</h1>
      <label for="playerShape">Shape:</label>
      <select id="playerShape">
        <option value="circle">Circle</option>
        <option value="square">Square</option>
        <option value="triangle">Triangle</option>
      </select>

      <label>Player Color:</label>
      <input type="color" id="playerColor" value="#0000ff" />
      <label>Hook Color:</label>
      <input type="color" id="hookColor" value="#ffffff" />
      <label>Particle Color:</label>
      <input type="color" id="particleColor" value="#ffcc00" />
      <div>
        <button id="saveBtn" class="btn">Save</button>
        <button id="backBtn" class="btn">Back</button>
      </div>
    </div>

    <!-- Game Canvas -->
    <canvas id="gameCanvas" style="display: none"></canvas>

    <script defer src="/socket.io/socket.io.js"></script>
    <script defer src="/game.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const home = document.getElementById("home");
        const canvas = document.getElementById("gameCanvas");
        const startBtn = document.getElementById("startBtn");
        const customizeBtn = document.getElementById("customizeBtn");
        const panel = document.getElementById("customizePanel");
        const saveBtn = document.getElementById("saveBtn");
        const backBtn = document.getElementById("backBtn");
        const nameInput = document.getElementById("playerName");
        const playerColor = document.getElementById("playerColor");
        const hookColor = document.getElementById("hookColor");
        const particleColor = document.getElementById("particleColor");

        function buildConfig() {
          return {
            name: nameInput.value || "Player",
            color: playerColor.value,
            hook: hookColor.value,
            particle: particleColor.value,
          };
        }

        window.playerConfig = buildConfig();

        customizeBtn.addEventListener("click", () => {
          window.playerConfig = buildConfig();
          home.style.display = "none";
          panel.style.display = "flex";
        });
        backBtn.addEventListener("click", () => {
          panel.style.display = "none";
          home.style.display = "flex";
        });
        saveBtn.addEventListener("click", () => {
          window.playerConfig = buildConfig();
          panel.style.display = "none";
          home.style.display = "flex";
        });
        startBtn.addEventListener("click", () => {
          window.playerConfig = buildConfig();
          home.style.display = "none";
          panel.style.display = "none";
          canvas.style.display = "block";
          canvas.focus(); // ensure keyboard focus
          if (window.startGame) window.startGame();
        });
      });
    </script>
  </body>
</html>

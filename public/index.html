<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grapple Arena</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Homepage and Customizer styles */
      .fullscreen-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #2a2a49 0%, #1a1a2f 80%);
        color: #f0f0f5;
        flex-direction: column;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
        font-family: "Orbitron", sans-serif;
      }
      .fullscreen-overlay h1 {
        font-size: 5rem;
        margin-bottom: 1rem;
        letter-spacing: 6px;
        background: linear-gradient(90deg, #ff0080, #ff8c00, #40e0d0, #ff0080);
        background-size: 300% 300%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: rainbow 5s ease infinite;
      }
      @keyframes rainbow {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
      .btn {
        padding: 0.75rem 2rem;
        font-size: 1.25rem;
        font-weight: bold;
        color: #fff;
        background: linear-gradient(45deg, #ff0080, #ff8c00);
        border: none;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        transition: transform 0.2s, box-shadow 0.2s;
        margin: 0.5rem;
      }
      .btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
      }
      .btn:active {
        transform: translateY(0);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      }

      /* Customizer panel */
      #customizePanel {
        display: none;
        background: rgba(30, 30, 45, 0.9);
        padding: 2rem;
        border-radius: 16px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.7);
      }
      #customizePanel label {
        display: block;
        margin: 1rem 0 0.5rem;
        font-size: 1.125rem;
      }
      #customizePanel input[type="color"] {
        width: 60px;
        height: 40px;
        border: none;
        cursor: pointer;
      }
      #customizePanel .btn-group {
        margin-top: 1.5rem;
      }
    </style>
  </head>
  <body>
    <!-- Homepage Screen -->
    <div id="home" class="fullscreen-overlay">
      <h1>🔗 Grapple Arena</h1>
      <div>
        <button id="startBtn" class="btn">Start Game</button>
        <button id="customizeBtn" class="btn">Customize</button>
      </div>
    </div>

    <!-- Customizer Screen -->
    <div id="customizePanel" class="fullscreen-overlay">
      <h1>Customize Your Gear</h1>
      <label for="playerColor">Player Color:</label>
      <input type="color" id="playerColor" value="#0000ff" />
      <label for="hookColor">Hook Color:</label>
      <input type="color" id="hookColor" value="#ffffff" />
      <label for="particleColor">Particle Color:</label>
      <input type="color" id="particleColor" value="#ffcc00" />
      <div class="btn-group">
        <button id="saveBtn" class="btn">Save</button>
        <button id="backBtn" class="btn">Back</button>
      </div>
    </div>

    <!-- Game Canvas -->
    <canvas id="gameCanvas" style="display: none"></canvas>

    <script defer src="/socket.io/socket.io.js"></script>
    <script defer src="/game.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const home = document.getElementById("home");
        const canvas = document.getElementById("gameCanvas");
        const startBtn = document.getElementById("startBtn");
        const customizeBtn = document.getElementById("customizeBtn");
        const panel = document.getElementById("customizePanel");
        const saveBtn = document.getElementById("saveBtn");
        const backBtn = document.getElementById("backBtn");
        const playerColor = document.getElementById("playerColor");
        const hookColor = document.getElementById("hookColor");
        const particleColor = document.getElementById("particleColor");

        // Default config
        window.playerConfig = {
          color: playerColor.value,
          hook: hookColor.value,
          particle: particleColor.value,
        };

        // Open customizer
        customizeBtn.addEventListener("click", () => {
          home.style.display = "none";
          panel.style.display = "flex";
        });
        // Back to home
        backBtn.addEventListener("click", () => {
          panel.style.display = "none";
          home.style.display = "flex";
        });
        // Save config
        saveBtn.addEventListener("click", () => {
          window.playerConfig = {
            color: playerColor.value,
            hook: hookColor.value,
            particle: particleColor.value,
          };
          panel.style.display = "none";
          home.style.display = "flex";
        });
        // Start game
        startBtn.addEventListener("click", () => {
          home.style.display = "none";
          panel.style.display = "none";
          canvas.style.display = "block";
          if (window.startGame) window.startGame();
          window.dispatchEvent(new Event("resize"));
        });
      });
    </script>
  </body>
</html>
